name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # tauri-action creates the draft release + uploads the MSI
    defaults:
      run:
        working-directory: limitboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: limitboard/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: limitboard/src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: limitboard
          tagName: ${{ github.ref_name }}
          releaseName: "Limitboard ${{ github.ref_name }}"
          releaseDraft: true
          # MSI via WiX; WebView2 bootstrapper is embedded by the bundler
          # (bundle.windows.webviewInstallMode defaults to downloadBootstrapper).
          args: --bundles msi
